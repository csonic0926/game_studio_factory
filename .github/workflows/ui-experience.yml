name: UI Experience

on:
  workflow_dispatch:
  push:
    branches: [frontier]
    paths:
      - "ui/**"
      - "factory_core/**"
      - "studio/tests/install_godot_ci.py"
      - "skills/factory-design-*/**"
      - ".github/workflows/ui-experience.yml"
  pull_request:
    paths:
      - "ui/**"
      - "factory_core/**"
      - "studio/tests/install_godot_ci.py"
      - ".github/workflows/ui-experience.yml"

permissions:
  contents: read

jobs:
  regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r ui/requirements-visual.txt
      - name: Core and UI regressions (no engine)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          FACTORY_REQUIRE_CASE_INSENSITIVE_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: python -B ui/tests/run_non_engine.py

  real-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r ui/requirements-visual.txt
      - name: Install rendering prerequisites
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Install official Godot
        run: python studio/tests/install_godot_ci.py --version 4.7.2
      - name: Real rendered frame, observations and capture sealing
        env:
          FACTORY_REQUIRE_UI_CAPTURE: "1"
          UI_CAPTURE_TEST_OUTPUT: ${{ runner.temp }}/ui-capture-test-output
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest ui.tests.test_godot_capture -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-capture
          path: ${{ runner.temp }}/ui-capture-test-output
          include-hidden-files: true
          if-no-files-found: ignore
